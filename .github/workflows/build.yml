name: Build desktop releases

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86
            os: windows-2022
            python_arch: x86
            asset: windows-x86
          - name: Windows x64
            os: windows-2022
            python_arch: x64
            asset: windows-x64
          - name: Linux x86-64
            os: ubuntu-22.04
            python_arch: x64
            asset: linux-x86_64
          - name: macOS Apple Silicon
            os: macos-15
            python_arch: arm64
            asset: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            python_arch: x64
            asset: macos-x86_64
    env:
      VERSION_TAG: ${{ github.event.release.tag_name || 'preflight' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Install FFmpeg and virtual display on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-tk xvfb xauth
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test source
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name VideoMosaic --additional-hooks-dir hooks video_mosaic.py
      - name: Test Windows application and package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/VideoMosaic/VideoMosaic.exe' -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Application self-test failed: $($process.ExitCode)" }
          Copy-Item -LiteralPath 'README.md' -Destination 'dist/VideoMosaic/README.md'
          Copy-Item -LiteralPath 'third-party' -Destination 'dist/VideoMosaic/third-party' -Recurse
          New-Item -ItemType Directory -Path 'release-assets' -Force | Out-Null
          Compress-Archive -LiteralPath 'dist/VideoMosaic' -DestinationPath "release-assets/VideoMosaic-$env:VERSION_TAG-${{ matrix.asset }}.zip"
      - name: Test Linux application and package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a ./dist/VideoMosaic/VideoMosaic --self-test
          cp README.md dist/VideoMosaic/README.md
          cp -R third-party dist/VideoMosaic/third-party
          mkdir -p release-assets
          tar -czf "release-assets/VideoMosaic-${VERSION_TAG}-${{ matrix.asset }}.tar.gz" -C dist VideoMosaic
      - name: Test macOS application and package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./dist/VideoMosaic.app/Contents/MacOS/VideoMosaic --self-test
          mkdir -p release-assets release-stage/VideoMosaic
          ditto dist/VideoMosaic.app release-stage/VideoMosaic/VideoMosaic.app
          cp README.md release-stage/VideoMosaic/README.md
          cp -R third-party release-stage/VideoMosaic/third-party
          ditto -c -k --sequesterRsrc --keepParent release-stage/VideoMosaic "release-assets/VideoMosaic-${VERSION_TAG}-${{ matrix.asset }}.zip"
      - name: Save workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoMosaic-${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Attach release asset
        if: github.event_name == 'release'
        shell: bash
        run: gh release upload "$VERSION_TAG" release-assets/* --clobber
