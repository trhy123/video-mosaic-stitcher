name: Build desktop releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to refresh (leave blank for preflight)
        type: string
        required: false
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86
            os: windows-2022
            python_arch: x86
            asset: win_x86
          - name: Windows x64
            os: windows-2022
            python_arch: x64
            asset: win_x64
          - name: Linux x64
            os: ubuntu-22.04
            python_arch: x64
            asset: linux_x64
          - name: macOS Apple Silicon
            os: macos-15
            python_arch: arm64
            asset: macos_arm64
          - name: macOS Intel
            os: macos-15-intel
            python_arch: x64
            asset: macos_amd64
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Set package version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          version="${version:-preflight}"
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "PACKAGE_DIR=VideoMosaic_${version}_${{ matrix.asset }}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Install FFmpeg and virtual display on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-tk xvfb xauth zip binutils
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test source
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: python packaging/build.py
      - name: Test Windows application and package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/VideoMosaic/VideoMosaic.exe' -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Application self-test failed: $($process.ExitCode)" }
          $folder = $env:PACKAGE_DIR
          Copy-Item -LiteralPath 'README.md' -Destination 'dist/VideoMosaic/README.md'
          Move-Item -LiteralPath 'dist/VideoMosaic' -Destination "dist/$folder"
          New-Item -ItemType Directory -Path 'release-assets' -Force | Out-Null
          Compress-Archive -LiteralPath "dist/$folder" -DestinationPath "release-assets/$folder.zip"
      - name: Test Linux application and package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a ./dist/VideoMosaic/VideoMosaic --self-test
          folder="$PACKAGE_DIR"
          cp README.md dist/VideoMosaic/
          mkdir -p release-assets
          mv dist/VideoMosaic "dist/$folder"
          (cd dist && zip -qry "../release-assets/$folder.zip" "$folder")
      - name: Test macOS application and package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./dist/VideoMosaic.app/Contents/MacOS/VideoMosaic --self-test
          folder="$PACKAGE_DIR"
          mkdir -p release-assets "release-stage/$folder"
          ditto dist/VideoMosaic.app "release-stage/$folder/VideoMosaic.app"
          cp README.md "release-stage/$folder/"
          cp -R License "release-stage/$folder/"
          ditto -c -k --sequesterRsrc --keepParent "release-stage/$folder" "release-assets/$folder.zip"
      - name: Attach release asset
        if: env.RELEASE_TAG != ''
        shell: bash
        run: gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
